[project]
name = "continuity"
version = "0.1.0"
description = "A wiki maintainer agent: re-verifies claims against the live web and drafts cited, section-level edits."
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "parallel-web",
    # backend/ imports these directly. They used to arrive transitively through google-adk
    # too; that dependency went on Sept 1, 2026 when the orchestrator stopped being a graph.
    "fastapi",
    "uvicorn",
    # The ledger's store. There is no file fallback as of Sept 1, 2026 (`AGENTS.md` §2), so a
    # run needs a reachable MongoDB — the driver is not optional.
    "pymongo",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.ruff]
line-length = 100
src = ["tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["backend", "tests", "scripts"]
strict = true
# The ledger core is fully typed and must stay that way; vendor SDKs are untyped at the
# perimeter, so adapters relax this locally rather than globally.
warn_unused_ignores = true
